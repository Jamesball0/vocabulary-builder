<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocabulary Builder</title>
<style>
body{font-family:Arial;background:#f5f3ff;padding:25px}
main{max-width:650px;margin:auto;background:white;padding:25px;border-radius:15px}
input,textarea{width:100%;padding:12px;margin:8px 0;box-sizing:border-box}
textarea{height:75px}
button{padding:10px 15px;background:#7c3aed;color:white;border:0;border-radius:7px;cursor:pointer}
.card{background:#ede9fe;padding:15px;margin:12px 0;border-radius:9px}
.card button{margin:5px 5px 0 0}
</style>
</head>
<body>
<main>
<h1>Vocabulary Builder</h1>
<p>Save new words, meanings and examples.</p>

<input id="word" placeholder="English word">
<input id="meaning" placeholder="Meaning">
<textarea id="example" placeholder="Example sentence"></textarea>
<button onclick="addWord()">Save Word</button>

<h2>My Vocabulary</h2>
<input id="search" placeholder="Search vocabulary...">
<p id="summary"></p>
<div id="list"></div>
</main>
<script>
let words=JSON.parse(localStorage.getItem("myVocabulary")||"[]");

function save(){
 localStorage.setItem("myVocabulary",JSON.stringify(words));
 render();
}

function addWord(){
 const word=document.getElementById("word").value.trim();
 const meaning=document.getElementById("meaning").value.trim();
 const example=document.getElementById("example").value.trim();

 if(!word||!meaning){
  alert("Word and meaning are required.");
  return;
 }

 if(words.some(x=>x.word.toLowerCase()===word.toLowerCase())){
  alert("This word already exists.");
  return;
 }

 words.unshift({word,meaning,example,learned:false});

 document.getElementById("word").value="";
 document.getElementById("meaning").value="";
 document.getElementById("example").value="";
 save();
}

function render(){
 const query=document.getElementById("search").value.toLowerCase();
 const list=document.getElementById("list");
 list.innerHTML="";

 const filtered=words.filter(x=>
 x.word.toLowerCase().includes(query)||
 x.meaning.toLowerCase().includes(query)
 );

 filtered.forEach(item=>{
  const index=words.indexOf(item);
  const card=document.createElement("div");
  card.className="card";

  const heading=document.createElement("h3");
  heading.textContent=item.word;
  const meaning=document.createElement("p");
  meaning.textContent="Meaning: "+item.meaning;
  const example=document.createElement("p");
  example.textContent="Example: "+(item.example||"Not provided");
  const status=document.createElement("p");
  status.textContent=item.learned?"Learned ✓":"Not learned yet";

  const toggle=document.createElement("button");
  toggle.textContent=item.learned?"Mark Unlearned":"Mark Learned";
  toggle.onclick=()=>{
   words[index].learned=!words[index].learned;
   save();
  };

  const del=document.createElement("button");
  del.textContent="Delete";
  del.onclick=()=>{
   words.splice(index,1);
   save();
  };

  card.append(heading,meaning,example,status,toggle,del);
  list.appendChild(card);
 });

 const learned=words.filter(x=>x.learned).length;
 document.getElementById("summary").textContent=
 `${words.length} words saved | ${learned} learned`;
}

document.getElementById("search").addEventListener("input",render);
render();
</script>
</body>
</html>
